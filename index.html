<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SYSTEM UPGRADE — SAVINDU.EXE</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0d0a;
    --amber: #38e07a;
    --amber-dim: #1c7a44;
    --ink: #edf2e8;
    --ink-dim: #9aa694;
    --rule: #242b21;
    --panel: #12160f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background-color: var(--bg);
    color: var(--ink);
    font-family: 'JetBrains Mono', monospace;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background-image: repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(56,224,122,.03) 2px,rgba(56,224,122,.03) 3px);
  }
  .term {
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 8px;
    width: 90%;
    max-width: 700px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px rgba(56,224,122,0.1);
  }
  .term-bar {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.65rem 0.9rem;
    background: #161b13;
    border-bottom: 1px solid var(--rule);
  }
  .term-dot { width: 9px; height: 9px; border-radius: 50%; }
  .term-dot.r { background: #c9564a; }
  .term-dot.y { background: #c9a13b; }
  .term-dot.g { background: #4f9d5c; }
  .term-path { font-size: 0.68rem; color: var(--ink-dim); margin-left: 0.4rem; }
  .term-body {
    padding: 2rem;
    font-size: 0.9rem;
    line-height: 1.8;
  }
  .line { margin-bottom: 0.5rem; display: flex; gap: 0.8rem; }
  .prompt { color: var(--amber); font-weight: 700; }
  .error { color: #ff5f56; font-weight: 700; }
  .warn { color: #f1c40f; }
  .cursor {
    display: inline-block;
    width: 0.6em;
    height: 1.1em;
    background: var(--amber);
    vertical-align: middle;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .progress-bar {
    width: 100%;
    height: 12px;
    background: var(--rule);
    border-radius: 6px;
    margin: 1.5rem 0;
    overflow: hidden;
    position: relative;
  }
  .progress-fill {
    width: 98%;
    height: 100%;
    background: var(--amber);
    border-radius: 6px;
    animation: pulse 2s infinite ease-in-out;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  .btn {
    background: transparent;
    border: 1px solid var(--rule);
    color: var(--ink-dim);
    font-family: inherit;
    font-size: 0.75rem;
    padding: 0.6rem 1.2rem;
    cursor: pointer;
    border-radius: 4px;
    transition: 0.2s;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .btn:hover { border-color: var(--amber); color: var(--amber); }
</style>
</head>
<body>
  <div class="term">
    <div class="term-bar">
      <span class="term-dot r"></span><span class="term-dot y"></span><span class="term-dot g"></span>
      <span class="term-path">~/savindu — status: upgrade</span>
    </div>
    <div class="term-body">
      <div class="line"><span class="prompt">$</span> <span>git push origin main --force</span></div>
      <div class="line"><span class="warn">[WARN]</span> <span>Overriding production branch...</span></div>
      <div class="line"><span class="error">[ERROR 404]</span> <span>Oh so you looked into this site under a fucking upgrade : error 404</span></div>
      <div class="line"><span class="prompt">$</span> <span>status --check</span></div>
      <div class="line"><span style="color: var(--ink-dim)">Rebuilding core modules...</span></div>
      
      <div class="progress-bar">
        <div class="progress-fill"></div>
      </div>
      
      <div class="line" style="justify-content: space-between; margin-top: 1rem;">
        <span style="color: var(--ink-dim)">98% complete — almost there bro</span>
        <button class="btn" onclick="window.location.reload()">Retry Connection</button>
      </div>
      
      <div class="line" style="margin-top: 1.5rem;">
        <span class="prompt">$</span> <span class="cursor"></span>
      </div>
    </div>
  </div>
</body>
</html>
